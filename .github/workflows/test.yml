name: Tests

# Pull requests only. Pushes to main are covered by the `test` gate job
# inside deploy-hetzner.yml, which blocks the build/deploy on failure —
# running the suite here too would just duplicate ~60s of CI on every
# push without adding a signal.
on:
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        env:
          # Use SQLite in CI — no Postgres/Redis needed for unit tests.
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          DATABASE_URL_SYNC: "sqlite:///:memory:"
          CELERY_BROKER_URL: "memory://"
          CELERY_RESULT_BACKEND: "cache+memory://"
          GEMINI_API_KEY: ""
        run: pytest tests/ -v --tb=short
