services:
  # ── Production overrides: GHCR images + Docker-internal hostnames ────────────
  # The backend's .env file uses local Mac dev hostnames/ports (localhost:6382 etc).
  # In production all services live on the same Docker network and must use
  # internal container names + standard ports. These environment values override
  # whatever .env says.
  #
  # Memory caps sized for a 4 GB Hetzner CX23 (leaves ~500 MB headroom for OS +
  # Docker). Without these, a runaway backtest / heavy yfinance pull can push a
  # single container past what's free and get OOM-killed by the kernel, taking
  # down user-facing traffic. `restart: unless-stopped` auto-recovers if that
  # still happens (was previously implicit "no" — a killed backend stayed down).

  postgres:
    restart: unless-stopped
    mem_limit: 700m

  redis:
    restart: unless-stopped
    mem_limit: 200m

  backend:
    image: ghcr.io/stoufeeq/jarvis-backend:latest
    build:
      context: ./backend
    restart: unless-stopped
    mem_limit: 1200m
    environment:
      DATABASE_URL: postgresql+asyncpg://jarvis:jarvis_dev@postgres:5432/jarvis
      DATABASE_URL_SYNC: postgresql://jarvis:jarvis_dev@postgres:5432/jarvis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Git SHA forwarded from the deploy workflow's shell env so the
      # /health endpoint (and Sentry release tag) report the deployed commit.
      GIT_SHA: ${GIT_SHA:-unknown}

  celery_worker:
    image: ghcr.io/stoufeeq/jarvis-backend:latest
    build:
      context: ./backend
    restart: unless-stopped
    mem_limit: 900m
    environment:
      COMMAND: worker  # entrypoint switches on this — without it, container runs uvicorn instead
      DATABASE_URL: postgresql+asyncpg://jarvis:jarvis_dev@postgres:5432/jarvis
      DATABASE_URL_SYNC: postgresql://jarvis:jarvis_dev@postgres:5432/jarvis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Git SHA forwarded from the deploy workflow's shell env so the
      # /health endpoint (and Sentry release tag) report the deployed commit.
      GIT_SHA: ${GIT_SHA:-unknown}

  celery_beat:
    image: ghcr.io/stoufeeq/jarvis-backend:latest
    build:
      context: ./backend
    restart: unless-stopped
    mem_limit: 250m
    environment:
      COMMAND: beat  # entrypoint switches on this — without it, container runs uvicorn instead
      DATABASE_URL: postgresql+asyncpg://jarvis:jarvis_dev@postgres:5432/jarvis
      DATABASE_URL_SYNC: postgresql://jarvis:jarvis_dev@postgres:5432/jarvis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Git SHA forwarded from the deploy workflow's shell env so the
      # /health endpoint (and Sentry release tag) report the deployed commit.
      GIT_SHA: ${GIT_SHA:-unknown}

  flower:
    image: ghcr.io/stoufeeq/jarvis-backend:latest
    build:
      context: ./backend
    restart: unless-stopped
    mem_limit: 200m
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
